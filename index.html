<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf7ef" />
    <meta name="description" content="セーブ・キトゥン: ねこを ぜんぶ たすけよう" />
    <title>セーブ・キトゥン</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1e6d8;
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
          "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #phone {
        position: relative;
        width: min(100vw, 430px);
        height: min(100vh, 932px);
        height: min(100dvh, 932px);
        overflow: hidden;
        background: #fdf7ef;
      }
      @media (min-width: 500px) {
        #phone {
          width: 390px;
          height: min(92vh, 844px);
          border-radius: 28px;
          box-shadow: 0 10px 34px rgba(74, 59, 48, 0.2);
        }
      }

      /* The sticky banner's height. The canvas stops above it, so the board
         and its buttons never sit under the ad. Keep in step with #ad-slot. */
      :root {
        --ad-h: 62px;
      }

      #game {
        display: block;
        width: 100%;
        height: calc(100% - var(--ad-h));
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Boot overlay: the loading countdown and the MREC placeholder ────
         Covers the canvas until the countdown ends, then is removed. */
      #boot {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fdf7ef;
        transition: opacity 0.3s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Exactly 300×250 so GAM can fill it. The label sits outside the slot. */
      #boot .mrec {
        position: relative;
        width: 300px;
        height: 250px;
        flex: 0 0 auto;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 4px 14px rgba(74, 59, 48, 0.12);
      }
      #gam-mrec-300x250 {
        width: 100%;
        height: 100%;
      }
      #boot-countdown {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        color: #4a3b30;
      }
      #boot .rule {
        width: min(52vw, 260px);
        height: 4px;
        border-radius: 999px;
        background: #efdcc7;
        overflow: hidden;
      }
      #boot .rule span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: #e8833a;
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .rule span {
          animation: none;
          width: 100%;
        }
      }

      /* ── Sticky banner: a DOM overlay, not canvas-drawn. Live ad tags render
         their own iframes and cannot paint into a 2D context. src/ui/adSlot.ts
         fills it, and mountAdCreative() is the integration point. Visible on
         every screen. */
      #ad-slot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--ad-h);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 8px;
        box-sizing: border-box;
        background: transparent;
        transform: translateY(0);
        opacity: 1;
        transition:
          transform 0.22s ease,
          opacity 0.22s ease;
      }
      #ad-slot[data-hidden='true'] {
        transform: translateY(115%);
        opacity: 0;
        pointer-events: none;
      }
      #ad-frame {
        position: relative;
        box-shadow: 0 2px 8px rgba(74, 59, 48, 0.14);
        border-radius: 6px;
        overflow: hidden;
        background: #ffffff;
      }
      #ad-creative {
        width: 100%;
        height: 100%;
      }
      #gam-banner-320x50 {
        width: 100%;
        height: 100%;
      }
      /* The disclosure label, shared by both placeholders. */
      .ad-label {
        position: absolute;
        top: 2px;
        left: 4px;
        z-index: 2;
        font-size: 9px;
        font-weight: 500;
        color: #4a3b30;
        opacity: 0.7;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="phone">
      <canvas id="game" role="img" aria-label="セーブ・キトゥン"></canvas>

      <!-- Loading overlay: a 5-second countdown with the MREC placeholder. -->
      <div id="boot">
        <div class="mrec">
          <span class="ad-label">広告</span>
          <div id="gam-mrec-300x250"></div>
        </div>
        <p id="boot-countdown" aria-live="polite">ゲームは 5 秒後に始まります</p>
        <div class="rule"><span></span></div>
      </div>

      <!-- Sticky banner placeholder, 320×50, on every screen. -->
      <div id="ad-slot" data-hidden="true" aria-label="広告">
        <div id="ad-frame">
          <span id="ad-label" class="ad-label">広告</span>
          <div id="ad-creative">
            <div id="gam-banner-320x50"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
